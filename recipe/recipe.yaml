schema_version: 1

context:
  version: "2.0.2"

package:
  name: pystac-ext-projection
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pystac-ext-projection/pystac_ext_projection-${{ version }}.tar.gz
  sha256: 13d1445ebaf2d4a73ef0bf1b17b49678d81da2a51f89dc9f919e2554b14c6062

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pystac-core

tests:
  - python:
      imports:
        - pystac.extensions.projection
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Projection extension for PySTAC
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/pystac-ext-projection/
  documentation: https://pystac.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf
